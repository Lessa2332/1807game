<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Суперсили 8-го загону</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f79d1e, #e66a0b);
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, rgba(255,215,0,0.3), transparent 70%);
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 70px 20px 70px 20px;
            padding: 35px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4);
            border: 5px solid #ffd93d;
            position: relative;
        }
        .garfield-icon {
            font-size: 4.5rem;
            background: #fdcb6e;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -55px auto 15px auto;
            box-shadow: 0 10px 0 #b85c0a;
            border: 3px solid white;
        }
        h1 {
            font-size: 1.6rem;
            color: #2d1b0e;
            margin-bottom: 5px;
        }
        .sub {
            color: #6b3a0a;
            font-weight: 700;
            background: #ffeaa7;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .power-number {
            font-size: 5rem;
            font-weight: 900;
            color: #e17055;
            background: #fff0e0;
            border-radius: 60px;
            padding: 5px 20px;
            display: inline-block;
            margin: 10px 0 5px;
            line-height: 1.2;
        }
        .power-name {
            font-size: 2rem;
            font-weight: 800;
            color: #2d3436;
            background: #dfe6e9;
            padding: 15px 10px;
            border-radius: 50px;
            margin: 15px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px dashed #fdcb6e;
            word-break: break-word;
        }
        .power-desc {
            font-size: 1.2rem;
            color: #2d3436;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 30px;
            margin-bottom: 25px;
            font-weight: 500;
            min-height: 60px;
        }
        .btn {
            background: linear-gradient(135deg, #ff9ff3, #f368e0);
            border: none;
            color: white;
            font-weight: 800;
            font-size: 1.6rem;
            padding: 18px 20px;
            border-radius: 60px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 8px 0 #8f2d7a;
            transition: 0.08s linear;
            letter-spacing: 1px;
        }
        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #8f2d7a;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 4px 0 #8f2d7a;
            pointer-events: none;
        }
        .reset-btn {
            margin-top: 15px;
            background: #b2bec3;
            box-shadow: 0 5px 0 #636e72;
            font-size: 1rem;
            padding: 12px;
            color: #2d3436;
        }
        .reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #636e72;
        }
        .counter-status {
            margin: 15px 0 5px;
            color: #6c3a1a;
            font-weight: 600;
        }
        .footer {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #b85c0a;
            font-weight: 600;
        }
        .badge-23 {
            background: #e17055;
            color: white;
            padding: 3px 15px;
            border-radius: 40px;
            font-weight: 900;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="garfield-icon">🐱</div>
    <h1>⚡ Суперсили</h1>
    <div class="sub">8-й загін · День дружби</div>
    
    <div class="badge-23">👩‍🏫 Ведуча №23</div>

    <div id="statusDisplay" class="counter-status">Готовий видати силу #1</div>
    
    <div class="power-number" id="powerNumber">#--</div>
    <div class="power-name" id="powerName">Натисни кнопку</div>
    <div class="power-desc" id="powerDesc">Щоб активувати силу для друга</div>

    <button class="btn" id="nextBtn">🚀 Видати силу!</button>
    <button class="btn reset-btn" id="resetBtn">🔄 Скинути всі сили (почати з №1)</button>
    <div class="footer">🐱 Гарфілд схвалює! Кожна сила — унікальна.</div>
</div>

<script>
    (function() {
        // ===== БАЗА З 20 УНІКАЛЬНИХ СУПЕРСИЛ =====
        const POWER_LIST = [
            { name: "📢 Гучномовець", desc: "Твій голос чути навіть у космосі! Очоль будь-яку гру." },
            { name: "🤝 Єднальник", desc: "Ти можеш об'єднати будь-яких двох незнайомців одним дотиком." },
            { name: "🎨 Креативний геній", desc: "З паперу та ножиць ти створиш шедевр за 1 хвилину!" },
            { name: "😄 Король усмішок", desc: "Твоя посмішка змушує всіх навколо сміятися разом з тобою." },
            { name: "🧠 Мудра сова", desc: "Ти знаєш відповіді на всі питання і допомагаєш команді." },
            { name: "💪 Мотиватор", desc: "Навіть найсором'язливіші стають сміливими поруч із тобою." },
            { name: "🎯 Снайпер пам'яті", desc: "Ти запам'ятаєш усі 20 імен за 5 хвилин!" },
            { name: "🌀 Хаотичний танцюрист", desc: "Заведи всіх своїм рухом — і вся кімната танцює!" },
            { name: "📖 Казкар", desc: "Ти придумаєш найнеймовірнішу спільну історію." },
            { name: "🌟 Зірковий лідер", desc: "Веди команду до перемоги в будь-якому змаганні." },
            { name: "🔮 Чарівник передбачень", desc: "Ти бачиш, що сьогодні кожен знайде справжнього друга." },
            { name: "🕊 Миротворець", desc: "Якщо виникає суперечка — ти її вирішуєш жартом." },
            { name: "🏃 Енерджайзер", desc: "Твоя енергія заряджає всіх навколо, навіть Гарфілда!" },
            { name: "🧩 Майстер пазлів", desc: "Ти знайдеш спільне навіть у найрізноманітніших речах." },
            { name: "❤️ Хранитель тепла", desc: "Твої компліменти зігрівають серця краще за сонце." },
            { name: "🎭 Актор-імітатор", desc: "Ти можеш показати будь-яку тварину, і всі вгадають!" },
            { name: "🗣 Перекладач дружби", desc: "Ти пояснюєш правила так, що зрозуміло навіть інопланетянам." },
            { name: "⏳ Хранитель часу", desc: "Ти стежиш за таймером і рятуєш команду від запізнень." },
            { name: "🎁 Дарувальник скарбів", desc: "Ти робиш маленькі подарунки з паперу для кожного друга." },
            { name: "👑 Головний друг", desc: "Ти — душа цього загону! Саме ти об'єднаєш усіх у фінальне коло." }
        ];

        const TOTAL = POWER_LIST.length; // 20

        // Отримуємо доступ до елементів
        const statusDisplay = document.getElementById('statusDisplay');
        const powerNumber = document.getElementById('powerNumber');
        const powerName = document.getElementById('powerName');
        const powerDesc = document.getElementById('powerDesc');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Ключ для збереження індексу в sessionStorage
        const STORAGE_KEY = 'garfield_power_index_57';

        // Функція отримання поточного індексу (з sessionStorage)
        function getCurrentIndex() {
            const stored = sessionStorage.getItem(STORAGE_KEY);
            if (stored !== null) {
                return parseInt(stored, 10);
            }
            return 0; // Починаємо з 0 (перша сила)
        }

        // Функція збереження індексу
        function saveCurrentIndex(index) {
            sessionStorage.setItem(STORAGE_KEY, index.toString());
        }

        // Функція оновлення інтерфейсу
        function updateDisplay(index) {
            if (index >= TOTAL) {
                // Всі сили використано
                powerNumber.textContent = '🎉';
                powerName.textContent = 'ВСІ СИЛИ АКТИВОВАНІ!';
                powerDesc.textContent = 'Ти об\'єднав усіх 20 героїв. Гарфілд пишається тобою!';
                statusDisplay.textContent = '✅ Усі 20 сил роздано!';
                nextBtn.disabled = true;
                return;
            }

            const power = POWER_LIST[index];
            const displayIndex = index + 1; // для людини показуємо з 1
            powerNumber.textContent = `#${displayIndex}`;
            powerName.textContent = power.name;
            powerDesc.textContent = power.desc;
            statusDisplay.textContent = `Видано ${displayIndex} з ${TOTAL} · Наступна: #${displayIndex + 1}`;
            nextBtn.disabled = false;
        }

        // Головна дія: видати наступну силу
        function giveNextPower() {
            let current = getCurrentIndex();

            // Якщо вже всі видані - нічого не робимо
            if (current >= TOTAL) {
                updateDisplay(current);
                return;
            }

            // Показуємо поточну (нову) силу
            updateDisplay(current);

            // Збільшуємо лічильник для наступного разу
            const nextIndex = current + 1;
            saveCurrentIndex(nextIndex);
        }

        // Скидання (почати з №1)
        function resetAll() {
            saveCurrentIndex(0);
            // Очищаємо дисплей, показуємо першу силу (але не видаємо її автоматично, просто оновлюємо стан)
            const current = getCurrentIndex();
            updateDisplay(current);
            // Спеціально робимо підказку
            powerNumber.textContent = '#--';
            powerName.textContent = 'Готовий до старту';
            powerDesc.textContent = 'Натисни "Видати силу!", щоб активувати першого героя';
            statusDisplay.textContent = 'Скинуто! Готовий видати силу #1';
            nextBtn.disabled = false;
        }

        // Ініціалізація при завантаженні сторінки
        function init() {
            // Перевіряємо, чи є збережений індекс. Якщо немає - ставимо 0.
            if (sessionStorage.getItem(STORAGE_KEY) === null) {
                saveCurrentIndex(0);
            }
            
            const current = getCurrentIndex();
            
            // Якщо індекс в межах 0..19 - показуємо готовність, але самі сили не видаємо автоматично.
            // Але краще показати наступну доступну силу (без автоматичної видачі)
            if (current < TOTAL) {
                const power = POWER_LIST[current];
                powerNumber.textContent = `#${current + 1}`;
                powerName.textContent = power.name;
                powerDesc.textContent = power.desc;
                statusDisplay.textContent = `Готовий видати силу #${current + 1} з ${TOTAL}`;
                nextBtn.disabled = false;
            } else {
                // Всі вже видані
                powerNumber.textContent = '🎉';
                powerName.textContent = 'ВСІ СИЛИ АКТИВОВАНІ!';
                powerDesc.textContent = 'Ти об\'єднав усіх 20 героїв. Гарфілд пишається тобою!';
                statusDisplay.textContent = '✅ Усі 20 сил роздано!';
                nextBtn.disabled = true;
            }
        }

        // Навішуємо обробники
        nextBtn.addEventListener('click', giveNextPower);
        resetBtn.addEventListener('click', resetAll);

        // Стартуємо
        init();

        // Захист від випадкового оновлення (попередження, але sessionStorage зберігає прогрес)
        window.addEventListener('beforeunload', function() {
            // нічого не робимо, просто зберігаємо стан
        });
    })();
</script>
</body>
</html>
