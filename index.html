<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f79d1e">
    <title>Завдання · 8-й загін</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f79d1e, #d35400);
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 15px;
        }
        .container {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 50px 20px 50px 20px;
            padding: 30px 20px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 30px rgba(0,0,0,0.4);
            border: 5px solid #fdcb6e;
        }
        .icon {
            font-size: 3.5rem;
            background: #fdcb6e;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -60px auto 10px auto;
            box-shadow: 0 6px 0 #b85c0a;
            border: 3px solid white;
        }
        h1 { font-size: clamp(1.3rem, 5vw, 1.5rem); color: #2d1b0e; }
        .sub {
            color: #6b3a0a; font-weight: 700; background: #ffeaa7;
            display: inline-block; padding: 5px 18px; border-radius: 40px;
            font-size: 0.9rem; margin-bottom: 15px;
        }
        .input-area {
            background: #f1f2f6; padding: 15px; border-radius: 35px;
            margin: 15px 0; display: flex; gap: 8px; align-items: center;
            border: 3px solid #dfe6e9; justify-content: center;
        }
        .input-area label { font-weight: 700; color: #2d3436; font-size: 1.1rem; }
        .input-area input {
            flex: 1; padding: 10px; border: 2px solid #b2bec3;
            border-radius: 25px; font-size: 1.3rem; font-weight: 800;
            text-align: center; max-width: 100px; background: white;
            outline: none; transition: 0.2s; color: #2d3436;
            min-height: 48px; /* Сенсорна зона */
        }
        .input-area input:focus { border-color: #fdcb6e; box-shadow: 0 0 0 4px rgba(253, 203, 110, 0.3); }
        .input-area input::placeholder { font-size: 0.9rem; font-weight: 400; color: #b2bec3; }
        .btn {
            background: linear-gradient(135deg, #ff9ff3, #f368e0); border: none;
            color: white; font-weight: 800; font-size: 1.1rem;
            padding: 12px 20px; border-radius: 25px; cursor: pointer;
            box-shadow: 0 6px 0 #8f2d7a; transition: 0.1s; min-height: 48px;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8f2d7a; }
        .reset-btn {
            margin-top: 12px; background: #b2bec3; box-shadow: 0 5px 0 #636e72;
            font-size: 1rem; padding: 12px; color: #2d3436; width: 100%;
            border: none; border-radius: 30px; font-weight: 700; cursor: pointer;
            min-height: 48px; /* Сенсорна зона */
        }
        .reset-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #636e72; }
        
        .power-number {
            font-size: clamp(3rem, 10vw, 4.2rem); /* Масштабується на малих екранах */
            font-weight: 900; color: #e17055; background: #fff0e0;
            border-radius: 40px; padding: 5px 20px; display: inline-block;
            line-height: 1.2; margin: 10px 0 5px;
        }
        .power-desc {
            font-size: 1.2rem; font-weight: 600; color: #2d3436;
            background: #f8f9fa; padding: 20px 15px; border-radius: 25px;
            margin: 12px 0; min-height: 80px; display: flex;
            align-items: center; justify-content: center;
            border: 3px solid #dfe6e9; word-break: break-word; line-height: 1.4;
        }
        .error-msg {
            color: #d63031; font-weight: 700; background: #fab1a0;
            padding: 8px; border-radius: 20px; margin: 8px 0; font-size: 0.95rem;
        }
        .footer { margin-top: 15px; font-size: 0.8rem; color: #6b3a0a; font-weight: 500; }
        .hint { font-size: 0.85rem; color: #636e72; margin-bottom: 5px; }

        /* Адаптація для дуже вузьких екранів */
        @media (max-width: 340px) {
            .input-area { flex-direction: column; border-radius: 25px; }
            .input-area input { max-width: 100%; width: 100%; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon" aria-hidden="true">🐱</div>
    <h1>Таємні завдання</h1>
    <div class="sub">8-й загін · День дружби</div>

    <div class="input-area">
        <label for="braceletInput">#</label>
        <input type="number" id="braceletInput" min="1" max="57" placeholder="Номер" inputmode="numeric" pattern="[0-9]*" aria-label="Введіть номер з браслета">
        <button class="btn" id="showBtn" aria-label="Отримати завдання">Отримати</button>
    </div>

    <div id="errorDisplay" class="error-msg" style="display: none;" aria-live="assertive"></div>
    <div class="hint">Введи номер зі свого браслета (від 1 до 57)</div>

    <div aria-live="polite">
        <div class="power-number" id="powerNumber">#--</div>
        <div class="power-desc" id="powerDesc">Введи номер, щоб дізнатися завдання</div>
    </div>

    <button class="reset-btn" id="resetBtn" aria-label="Очистити поле">Очистити</button>
    <div class="footer">створила Олеся Олександрівна</div>
</div>

<script>
    (function() {
        const TASKS = [
            "Намалювати 5 веселих смайликів протягом 45 хвилин.",
            "Голосно сказати «8-й загін найкращий!» і плеснути в долоні.",
            "Зробити 10 присідань і голосно порахувати їх уголос.",
            "Знайти 3 людей із русявим волоссям і потиснути їм руки.",
            "Намалювати на долоні сусіда маленьке сонечко (ручкою).",
            "Скласти паперового журавлика або літачка за 2 хвилини.",
            "Заспівати 2 рядки будь-якої пісні про дружбу.",
            "Сказати комплімент кожному, хто стоїть праворуч від тебе.",
            "Протанцювати 15 секунд, як робот (з механічними рухами).",
            "Знайти людину з таким самим кольором очей, як у тебе.",
            "Голосно похвалити ведучу за чудовий настрій.",
            "Зібрати підписи 5 друзів на своєму паперовому браслеті.",
            "Розказати найсмішніший жарт, який ти знаєш.",
            "Сказати «Дякую!» 5 різним людям протягом наступної гри.",
            "Зробити «місток» зі своїх рук, щоб під ним пролізла інша дитина.",
            "Знайти 2 речі зеленого кольору в кімнаті й показати всім.",
            "Голосно прочитати будь-яке правило, написане на дошці.",
            "Намалювати портрет нового друга на папірці за 1 хвилину.",
            "Прострибати на одній нозі навколо стільця.",
            "Сказати «Я люблю свій загін!» голосніше за всіх.",
            "Поаплодувати своїй команді протягом 5 секунд.",
            "Заплющити очі та вгадати на дотик, хто стоїть поруч.",
            "Зробити «хвилю» руками, щоб сусіди повторювали за тобою.",
            "Дізнатися 3 улюблені мультфільми своїх сусідів.",
            "Зобразити кенгуру та проскакати по колу кімнати.",
            "Знайти найвищу людину в кімнаті й стати поряд з нею.",
            "Сказати «Ми разом!» і обійняти сусіда ліворуч.",
            "Написати своє ім'я на спільному аркуші красивими літерами.",
            "Зробити комплімент зачісці 3 дівчатам або хлопцям.",
            "Прошепотіти секретне слово «Гарфілд» на вухо 4 людям.",
            "Покрутитися на одному місці 5 разів і не впасти.",
            "Знайти пару та обмінятися з нею браслетами на 1 хвилину.",
            "Голосно зачитати назву своєї суперсили всій кімнаті.",
            "Намалювати 3 сердечка й подарувати тому, хто першим посміхнеться тобі.",
            "Порахувати, скільки дітей у кімнаті мають окуляри.",
            "Сказати «Сьогодні чудовий день!» 5 разів поспіль без сміху.",
            "Знайти людину, яка народилася влітку, і потанцювати з нею.",
            "Зібрати 5 папірців із підлоги та викинути в смітник.",
            "Намалювати будинок для своєї суперсили на аркуші.",
            "Придумати круту спільну назву для всієї команди й вигукнути її.",
            "Сказати «Бути другом — це круто!» голосно й чітко.",
            "Подати руку допомоги тому, хто сидить найдальше від тебе.",
            "Зробити 5 оплесків над головою та 5 перед собою.",
            "Написати побажання на папірці й кинути в спільний капелюх.",
            "Зобразити, як ти їси улюблену страву (без слів, щоб вгадали).",
            "Знайти у когось на браслеті парне число й показати його ведучій.",
            "Сказати «Я пишаюся своїми новими друзями!»",
            "Підняти руку й пообіцяти бути чесним і добрим сьогодні.",
            "Намалювати дощ із краплинок у формі сердець.",
            "Похитати головою «так» на кожне запитання ведучої.",
            "Скласти комплімент про посмішку ведучій.",
            "Розказати будь-який вірш (хоча б 4 рядки).",
            "Вигадати новий жест для слова «Дружба» й показати всім.",
            "Знайти й привітатися з тим, хто має номер на браслеті менший за 10.",
            "Сказати «Суперсила активована!» після кожного виконаного завдання.",
            "Зобразити, як ти пливеш брасом через усю кімнату.",
            "Побажати всім гарного дня, помахати рукою й посміхнутися."
        ];

        const TOTAL = TASKS.length;

        const braceletInput = document.getElementById('braceletInput');
        const showBtn = document.getElementById('showBtn');
        const resetBtn = document.getElementById('resetBtn');
        const powerNumber = document.getElementById('powerNumber');
        const powerDesc = document.getElementById('powerDesc');
        const errorDisplay = document.getElementById('errorDisplay');

        function showTaskByNumber(number) {
            errorDisplay.style.display = 'none';
            errorDisplay.textContent = '';

            if (isNaN(number) || number < 1 || number > TOTAL) {
                errorDisplay.style.display = 'block';
                errorDisplay.textContent = `❌ Введи число від 1 до ${TOTAL}!`;
                powerNumber.textContent = '#--';
                powerDesc.textContent = 'Невірний номер, спробуй ще раз';
                return;
            }

            powerNumber.textContent = `#${number}`;
            powerDesc.textContent = TASKS[number - 1];
            
            // Ховаємо клавіатуру на телефоні, щоб звільнити екран
            braceletInput.blur();
        }

        function handleShow() {
            const raw = braceletInput.value.trim();
            const number = parseInt(raw, 10);
            showTaskByNumber(number);
        }

        function resetDisplay() {
            braceletInput.value = '';
            powerNumber.textContent = '#--';
            powerDesc.textContent = 'Введи номер, щоб дізнатися завдання';
            errorDisplay.style.display = 'none';
            errorDisplay.textContent = '';
            braceletInput.focus();
        }

        showBtn.addEventListener('click', handleShow);
        resetBtn.addEventListener('click', resetDisplay);

        braceletInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleShow();
            }
        });

        // На мобільних пристроях краще не робити автофокус при завантаженні сторінки, 
        // щоб клавіатура не вискакувала сама по собі і не перекривала екран.
        // Але якщо дуже треба, можна розкоментувати:
        // window.addEventListener('load', () => { braceletInput.focus(); });
    })();
</script>
</body>
</html>
